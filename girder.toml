# Development configuration for girder-on-girder (this very repo).
# Secrets live in ~/.config/girder/secrets.toml and are NEVER committed here.

[project]
name = "girder"
stack = "python-3.12"
test_directories = ["tests"]
test_signal_patterns = [
  "tests/**",
  "**/test_*.py",
  "**/*_test.py",
  "**/conftest.py",
  "tests/fixtures/**",
  "**/mocks/**",
]
protected_read_paths = [
  ".github/**",
  "openspec/**",
  ".git/**",
  ".env*",
  "**/*.pem",
  "**/*credentials*",
]
strict_read_scope = false

[autonomy]
tier = 0
t2_required_streak = 10
t1_review_window = 3

[budget]
run_cap_usd = 5.00

[limits]
attempt_wallclock_s = 600
attempt_max_turns = 20
task_max_attempts = 3
ci_fix_attempts = 3
conflict_resolution_attempts = 2
tool_output_max_lines = 100
tool_output_max_tokens = 4000

[sandbox]
runtime = "podman"   # falls back to docker when podman is absent
network = "none"
memory = "4g"
cpus = 2.0
pids_limit = 512

[github]
remote = "origin"
# api_url = "https://api.github.com"  # override for proxies/tests
poll_interval_s = 30.0   # CI checks poll cadence
poll_timeout_s = 3600.0  # exceeded ⇒ escalate, never poll forever
merge_method = "squash"  # merge | squash | rebase (T1/T2 auto-merge)

[notify]
channels = []

# Model registry (D7): the role is the commitment, the model id is config.
# All tiers on OpenRouter's rolling "latest" DeepSeek V4 Flash alias.
# Pricing/context pulled from openrouter.ai/api/v1/models on 2026-09-09.
[[models.roles]]
role = "tier1"  # specs, plan estimation, review
provider = "openrouter"
model = "~deepseek/deepseek-v4-flash-latest"
context_window = 1_310_720
max_output_tokens = 32768
price_in_per_mtok = 0.05
price_out_per_mtok = 0.16

[[models.roles]]
role = "tier2"  # coding attempts
provider = "openrouter"
model = "~deepseek/deepseek-v4-flash-latest"
context_window = 1_310_720
max_output_tokens = 32768
price_in_per_mtok = 0.05
price_out_per_mtok = 0.16

[[models.roles]]
role = "tier3"  # summaries, triage, utility calls
provider = "openrouter"
model = "~deepseek/deepseek-v4-flash-latest"
context_window = 1_310_720
max_output_tokens = 32768
price_in_per_mtok = 0.05
price_out_per_mtok = 0.16
