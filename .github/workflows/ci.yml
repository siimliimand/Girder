name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # WP 9.4: nightly sandbox/CI parity audit — the parity job's event filter
  # admits schedule; push/PR runs still skip it via the same filter.
  schedule:
    - cron: "0 3 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-type-unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run ruff check src tests
      - run: uv run mypy
      - run: uv run pytest -m "not integration"

  integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run pytest -m integration

  # Sandbox-image / CI toolchain parity audit (impl-plan §9.1, Sprint 4 WP 4.1).
  # Builds the runner image from container/Dockerfile.python-3.12 with podman,
  # dumps the CI runner's toolchain (container/ci-env-dump.sh), then fails on
  # any python/pip/pytest divergence between image and CI
  # (container/parity-check.sh -> girder.github.parity).
  #
  # Runs on workflow_dispatch (manual) and nightly via the schedule trigger
  # (WP 9.4); push/PR runs skip it — the container build dominates CI time.
  # A nightly parity failure surfaces through Girder's own CI poller
  # (github/ci.py) as a failed check on the default branch.
  parity:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install podman (image build + probe engine)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends podman
      - name: Build runner image
        run: podman build -t girder-runner:python-3.12 -f container/Dockerfile.python-3.12 container/
      - name: CI env dump (host runner toolchain)
        run: container/ci-env-dump.sh > ci-env-dump.txt
      - name: Parity check (image vs CI dump; divergence = hard failure)
        run: uv sync && container/parity-check.sh girder-runner:python-3.12 ci-env-dump.txt
